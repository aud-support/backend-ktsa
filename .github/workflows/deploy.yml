name: Build and Deploy Backend to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build the JAR
  # ─────────────────────────────────────────────
  build:
    name: Build Spring Boot JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (skip tests)
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: foosball-jar
          path: target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2: Deploy to EC2 (only on push to main)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    # Only deploy on actual push to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: foosball-jar
          path: ./artifact

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ktsa-key.pem
          chmod 600 ~/.ssh/ktsa-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy JAR to EC2
        run: |
          scp -i ~/.ssh/ktsa-key.pem ./artifact/foosball-*.jar \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/foosball.jar

      - name: Restart application on EC2
        run: |
          ssh -i ~/.ssh/ktsa-key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo systemctl restart ktsa-backend
            sleep 5
            sudo systemctl status ktsa-backend --no-pager
          EOF

      - name: Health check
        run: |
          sleep 20
          curl --fail --retry 5 --retry-delay 10 \
            http://${{ secrets.EC2_HOST }}:8080/actuator/health || \
            echo "Health check failed — check EC2 logs with: sudo journalctl -u ktsa-backend -n 100"
